# Evaluator manifest. docker compose up boots the API, Postgres, and the customer site.
status: runnable
run: docker compose up
seed: npm run seed
# npm test checks the widget model, submission path, delivery, and dashboard.
test: npm test
base_url: http://127.0.0.1:3010
endpoints:
  - method: POST
    path: /submissions
    note: Public submission. CORS, validation, rate limit, honeypot, geo, side effect.
  - method: OPTIONS
    path: /submissions
    note: Preflight for the cross-origin form post.
  - method: GET
    path: /widgets/:id/config
    note: Public config. Small payload. Short Cache-Control max-age.
  - method: GET
    path: /widget.v1.js
    note: Versioned widget bundle. Long cache. New version means a new URL.
  - method: GET
    path: /widgets/:id/embed
    note: Returns the one-line script snippet for this widget.
  - method: GET
    path: /dashboard/submissions
    note: Authenticated submission list. Tenant scoped.
  - method: GET
    path: /dashboard/stats
    note: Authenticated owner stats. Tenant scoped.
