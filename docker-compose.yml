# docker compose up starts the API, Postgres, and the customer site.
# docker compose --profile mail up also starts local Mailpit.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widget_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widget_platform"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://widget:widget@db:5432/widget_platform
      JWT_SECRET: local-dev-only-change-this
      WIDGET_PUBLIC_BASE_URL: http://localhost:3000
      WIDGET_ASSET_VERSION: v1
      RATE_LIMIT_IP_MAX: 30
      RATE_LIMIT_IP_WINDOW_MS: 60000
      RATE_LIMIT_WIDGET_MAX: 60
      RATE_LIMIT_WIDGET_WINDOW_MS: 60000
      GEO_MODE: mock
      GEO_PROVIDER_A_URL: http://ip-api.com
      GEO_PROVIDER_B_URL: https://ipapi.co
      GEO_MOCK_A_DOWN: "false"
      GEO_MOCK_B_DOWN: "false"
      EMAIL_MODE: console
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SIDE_EFFECT_FORCE_FAIL: "false"
    depends_on:
      db:
        condition: service_healthy

  customer-site:
    image: node:22-alpine
    working_dir: /site
    volumes:
      - ./customer-site:/site
    environment:
      CUSTOMER_SITE_PORT: 8080
    command: ["node", "server.js"]
    ports:
      - "8080:8080"

  mailpit:
    image: axllent/mailpit
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"
