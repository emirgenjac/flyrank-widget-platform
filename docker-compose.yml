# docker compose up starts the API and Postgres.
# docker compose --profile mail up also starts local Mailpit.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widget_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widget_platform"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://widget:widget@db:5432/widget_platform
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"
